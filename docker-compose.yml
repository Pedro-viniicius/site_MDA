# Ambiente de desenvolvimento da plataforma MDA
# Sobe tudo com: docker compose up --build
#   - db:  PostgreSQL 16 com extensão pgvector (busca semântica futura)
#   - api: FastAPI em http://localhost:8000 (documentação em /docs)
#   - web: Next.js em http://localhost:3000
name: mda-plataforma

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mda_senha_dev}
      POSTGRES_DB: ${POSTGRES_DB:-mda}
    ports:
      # 5433 no host para não conflitar com outros PostgreSQL locais.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mda} -d ${POSTGRES_DB:-mda}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mda:mda_senha_dev@db:5432/mda}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      # Código montado para recarga automática em desenvolvimento.
      - ./apps/api:/app
    ports:
      # 8001 no host para não conflitar com outras APIs locais.
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22
    working_dir: /app
    # `npm install` é rápido quando node_modules já existe (só confere).
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      API_URL_INTERNA: ${API_URL_INTERNA:-http://api:8000}
    volumes:
      - ./apps/web:/app
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
